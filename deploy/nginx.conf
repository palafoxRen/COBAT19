# Nginx reverse proxy para COBAT 19 — SSL/TLS termination
# Ubicar en /etc/nginx/sites-available/biblioteca
# Symlink a /etc/nginx/sites-enabled/biblioteca
#
# Pasos para configurar HTTPS con Let's Encrypt:
# 1. sudo apt install certbot python3-certbot-nginx
# 2. sudo certbot --nginx -d TU_DOMINIO
# 3. sudo certbot renew --dry-run  (verificar auto-renewal)
#
# Reemplaza TU_DOMINIO con tu dominio real (ej: biblioteca.cobat19.edu.mx)

server {
    listen 80;
    server_name TU_DOMINIO;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name TU_DOMINIO;

    # Certificados Let's Encrypt (certbot los genera automaticamente)
    ssl_certificate /etc/letsencrypt/live/TU_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO/privkey.pem;

    # Configuracion TLS moderna
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS — fuerza a los navegadores a usar HTTPS siempre
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;

    # Uploads estaticos (PDFs e imagenes) — sirve nginx directamente
    location /uploads/ {
        alias /opt/cobat_19/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API backend — proxy a Express
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Limitar tamano de uploads (multer ya tiene su limite, pero
        # nginx lo verifica antes de enviar al backend)
        client_max_body_size 25m;
    }

    # Frontend — React SPA (build estatico)
    location / {
        root /opt/cobat_19/frontend/dist;
        try_files $uri $uri/ /index.html;

        # Cache agresivo para assets de Vite (hash en filename)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Seguridad: ocultar header de version de nginx
    server_tokens off;
}
